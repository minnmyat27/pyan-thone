<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Pyan Thone logo</title>
  <desc id="desc">A white stylized PT monogram on a vivid blue rounded square.</desc>
  <defs>
